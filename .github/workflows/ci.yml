name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # Use `npm ci` once package-lock.json has been regenerated with the test dependencies.
      - run: npm ci || npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
